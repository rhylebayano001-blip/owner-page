<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Page - Ry’s Auto Shop</title>
<style>
body {font-family: Arial, Helvetica, sans-serif; background:#111; color:white; padding:20px;}
h1 {color:#ff3c00; text-align:center;}
table {width:100%; border-collapse:collapse; margin-top:20px;}
th, td {border:1px solid #ff3c00; padding:10px; text-align:center;}
th {background:#222;}
.done {background:#0a3;}
.pending {background:#333;}
button {padding:5px 10px; border:none; border-radius:5px; cursor:pointer;}
button.delete {background:#ff3c00; color:white;}
button.delete:hover {background:#cc2f00;}
select {padding:5px; margin-bottom:10px;}
</style>
</head>
<body>

<h1>Ry’s Auto Shop - Owner Page</h1>

<label for="sortSelect">Sort By: </label>
<select id="sortSelect">
    <option value="date">Date</option>
    <option value="time">Time</option>
    <option value="name">Name</option>
</select>

<h2>Pending Bookings</h2>
<table id="pendingTable">
    <thead>
        <tr>
            <th>Name</th>
            <th>Mobile</th>
            <th>Service</th>
            <th>Car Type</th>
            <th>Date</th>
            <th>Time</th>
            <th>Estimated Completion</th>
            <th>Done</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody id="pendingBody"></tbody>
</table>

<h2>Finished Bookings</h2>
<table id="finishedTable">
    <thead>
        <tr>
            <th>Name</th>
            <th>Mobile</th>
            <th>Service</th>
            <th>Car Type</th>
            <th>Date</th>
            <th>Time</th>
            <th>Estimated Completion</th>
        </tr>
    </thead>
    <tbody id="finishedBody"></tbody>
</table>

<script>
// Load bookings from localStorage
function getBookings() {
    return JSON.parse(localStorage.getItem('bookings')) || [];
}

// Render tables
function renderBookings() {
    const bookings = getBookings();
    const pendingBody = document.getElementById('pendingBody');
    const finishedBody = document.getElementById('finishedBody');
    pendingBody.innerHTML = '';
    finishedBody.innerHTML = '';

    bookings.forEach((b, index) => {
        const row = document.createElement('tr');
        row.className = b.done ? 'done' : 'pending';
        row.innerHTML = `
            <td>${b.name}</td>
            <td>${b.mobile}</td>
            <td>${b.service}</td>
            <td>${b.carType || '-'}</td>
            <td>${b.date}</td>
            <td>${b.time}</td>
            <td>${b.estimate}</td>
            ${b.done ? '' : `<td><input type="checkbox" data-index="${index}" class="doneCheckbox"></td>
                              <td><button data-index="${index}" class="delete">Delete</button></td>`}
        `;
        if(b.done){
            finishedBody.appendChild(row);
        } else {
            pendingBody.appendChild(row);
        }
    });

    // Event listeners for done checkboxes
    document.querySelectorAll('.doneCheckbox').forEach(cb => {
        cb.addEventListener('change', function(){
            const idx = this.dataset.index;
            const bookings = getBookings();
            bookings[idx].done = this.checked;
            localStorage.setItem('bookings', JSON.stringify(bookings));
            renderBookings();
        });
    });

    // Event listeners for delete buttons
    document.querySelectorAll('button.delete').forEach(btn => {
        btn.addEventListener('click', function(){
            const idx = this.dataset.index;
            const bookings = getBookings();
            bookings.splice(idx,1);
            localStorage.setItem('bookings', JSON.stringify(bookings));
            renderBookings();
        });
    });
}

// Sorting function
document.getElementById('sortSelect').addEventListener('change', function(){
    const sortBy = this.value;
    const bookings = getBookings();
    bookings.sort((a,b)=>{
        if(sortBy==='name') return a.name.localeCompare(b.name);
        if(sortBy==='date') return new Date(a.date) - new Date(b.date);
        if(sortBy==='time') return a.time.localeCompare(b.time);
    });
    localStorage.setItem('bookings', JSON.stringify(bookings));
    renderBookings();
});

// Initial render
renderBookings();
</script>

</body>
</html>
