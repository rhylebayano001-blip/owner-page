<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ry’s Auto Shop - Owner Page</title>
<style>
body{font-family:Arial, Helvetica, sans-serif; background:#111; color:white; margin:0; padding:20px;}
h1,h2{color:#ff3c00;}
table{width:100%; border-collapse:collapse; margin-top:20px;}
th, td{padding:10px; border:1px solid #444; text-align:center;}
th{background:#222;}
tr:nth-child(even){background:#1a1a1a;}
.btn{padding:5px 10px; border:none; border-radius:5px; cursor:pointer;}
.deleteBtn{background:#cc2f00; color:white;}
.deleteBtn:hover{background:#ff3c00;}
.summary{margin-top:20px; font-size:18px;}
</style>
</head>
<body>

<h1>Ry’s Auto Shop - Owner Dashboard</h1>

<div class="summary">
    <p><strong>Total Cars Today:</strong> <span id="totalCars">0</span></p>
    <p><strong>Total Income Today:</strong> ₱<span id="totalIncome">0</span></p>
</div>

<table id="bookingTable">
    <thead>
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>Service</th>
            <th>Car Type</th>
            <th>Price</th>
            <th>Date</th>
            <th>Time</th>
            <th>Payment Type</th>
            <th>Payment Method</th>
            <th>Estimated Completion</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
// Load bookings from localStorage
function loadBookings(){
    const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
    const tbody = document.querySelector('#bookingTable tbody');
    tbody.innerHTML = '';
    let totalCars = 0;
    let totalIncome = 0;
    const today = new Date().toISOString().split('T')[0]; // "YYYY-MM-DD"

    bookings.forEach((b,i)=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${i+1}</td>
            <td>${b.name}</td>
            <td>${b.mobile}</td>
            <td>${b.service}</td>
            <td>${b.carType}</td>
            <td>₱${b.price}</td>
            <td>${b.date}</td>
            <td>${b.time}</td>
            <td>${b.paymentType}</td>
            <td>${b.paymentMethod}</td>
            <td>${b.duration} ${b.duration===0.5 ? 'half day' : b.duration>1 ? 'days' : 'day'}</td>
            <td><button class="btn deleteBtn" data-index="${i}">Delete</button></td>
        `;
        tbody.appendChild(tr);

        // Count only today's bookings
        if(b.date === today){
            totalCars++;
            totalIncome += parseFloat(b.price);
        }
    });

    document.getElementById('totalCars').textContent = totalCars;
    document.getElementById('totalIncome').textContent = totalIncome.toFixed(2);

    // Add delete functionality
    document.querySelectorAll('.deleteBtn').forEach(btn=>{
        btn.addEventListener('click',()=>{
            const index = btn.getAttribute('data-index');
            if(confirm('Are you sure you want to delete this booking?')){
                bookings.splice(index,1);
                localStorage.setItem('bookings', JSON.stringify(bookings));
                loadBookings(); // reload table
            }
        });
    });
}

// Initial load
loadBookings();
</script>

</body>
</html>
