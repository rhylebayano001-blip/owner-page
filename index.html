<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ry’s Auto Shop - Owner Page</title>
<style>
body{font-family:Arial,sans-serif; background:#111; color:white; margin:0; padding:20px;}
h1{color:#ff3c00; text-align:center; margin-bottom:20px;}
section{margin-bottom:40px;}
input[type="text"], select{padding:8px; width:300px; margin-bottom:10px; border-radius:5px; border:none;}
table{width:100%; border-collapse:collapse; margin-top:10px;}
th,td{border:1px solid #555; padding:8px; text-align:left;}
th{background:#222;}
tr.pending{background:#222;}
tr.done{background:#003300; color:#0f0;}
tr.future{background:#1a1a1a;}
tr.today{background:#663300;}
tr.past{background:#555;}
button{padding:5px 10px; margin:2px; cursor:pointer; border:none; border-radius:5px; color:white;}
.btn-done{background:#00cc00;}
.btn-delete{background:#cc0000;}
</style>
</head>
<body>

<h1>Ry’s Auto Shop - Owner Dashboard</h1>

<section>
    <h2>Search / Filter Bookings</h2>
    <input type="text" id="searchInput" placeholder="Search by Name, Service, Car Type, or Date">
    <select id="sortSelect">
        <option value="">Sort By</option>
        <option value="name">Name</option>
        <option value="date">Date</option>
        <option value="time">Time</option>
    </select>
</section>

<section>
    <h2>Pending / Work Not Done</h2>
    <table id="pendingTable">
        <thead>
            <tr>
                <th>Name</th><th>Mobile</th><th>Service</th><th>Car Type</th><th>Oil/Fuel</th><th>Price</th><th>Date</th><th>Time</th><th>Payment</th><th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</section>

<section>
    <h2>Finished Work</h2>
    <table id="doneTable">
        <thead>
            <tr>
                <th>Name</th><th>Mobile</th><th>Service</th><th>Car Type</th><th>Oil/Fuel</th><th>Price</th><th>Date</th><th>Time</th><th>Payment</th><th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</section>

<script>
// Load bookings
let bookings = JSON.parse(localStorage.getItem('bookings')) || [];

// Render bookings with filter and sorting
function renderBookings(filter=''){
    const pendingTbody = document.getElementById('pendingTable').querySelector('tbody');
    const doneTbody = document.getElementById('doneTable').querySelector('tbody');
    pendingTbody.innerHTML = '';
    doneTbody.innerHTML = '';
    const now = new Date();
    const todayStr = now.toISOString().split('T')[0]; // yyyy-mm-dd

    // Sorting
    const sortBy = document.getElementById('sortSelect').value;
    let sortedBookings = [...bookings];
    if(sortBy==='name'){
        sortedBookings.sort((a,b)=>a.name.localeCompare(b.name));
    } else if(sortBy==='date'){
        sortedBookings.sort((a,b)=>new Date(a.date+'T'+a.time) - new Date(b.date+'T'+b.time));
    } else if(sortBy==='time'){
        sortedBookings.sort((a,b)=>{
            const t1 = a.time.split(':'); const t2 = b.time.split(':');
            return (parseInt(t1[0])*60 + parseInt(t1[1])) - (parseInt(t2[0])*60 + parseInt(t2[1]));
        });
    }

    sortedBookings.forEach((b, index)=>{
        const searchString = `${b.name} ${b.service} ${b.carType} ${b.date}`.toLowerCase();
        if(filter && !searchString.includes(filter.toLowerCase())) return;

        const row = document.createElement('tr');
        // Status color
        if(b.done) row.className='done';
        else {
            if(b.date === todayStr) row.className='today';
            else if(new Date(b.date+'T'+b.time) > now) row.className='future';
            else row.className='past';
        }

        const oilFuel = b.oilType ? `${b.oilType} / ${b.fuelType}` : '-';
        row.innerHTML = `
            <td>${b.name}</td>
            <td>${b.mobile}</td>
            <td>${b.service}</td>
            <td>${b.carType}</td>
            <td>${oilFuel}</td>
            <td>₱${b.price}</td>
            <td>${b.date}</td>
            <td>${b.time}</td>
            <td>${b.paymentType} (${b.paymentMethod})</td>
            <td>
                ${!b.done ? `<button class="btn-done" onclick="markDone(${index})">✔ Done</button>` : ''}
                <button class="btn-delete" onclick="deleteBooking(${index})">🗑 Delete</button>
            </td>
        `;
        if(b.done) doneTbody.appendChild(row);
        else pendingTbody.appendChild(row);
    });
}

// Mark as done
function markDone(index){
    bookings[index].done = true;
    localStorage.setItem('bookings', JSON.stringify(bookings));
    renderBookings(document.getElementById('searchInput').value);
}

// Delete booking
function deleteBooking(index){
    if(confirm("Are you sure you want to delete this booking?")){
        bookings.splice(index,1);
        localStorage.setItem('bookings', JSON.stringify(bookings));
        renderBookings(document.getElementById('searchInput').value);
    }
}

// Search filter
document.getElementById('searchInput').addEventListener('input', function(){
    renderBookings(this.value);
});

// Sorting
document.getElementById('sortSelect').addEventListener('change', function(){
    renderBookings(document.getElementById('searchInput').value);
});

// Initial render
renderBookings();
</script>

</body>
</html>
